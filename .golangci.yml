version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G115 # integer conversions are bounds-checked at construction time
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, perfsprint]

formatters:
  enable:
    - gofmt
    - goimports
